name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -W error -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -W error -m compileall -q src tests
      - run: for f in scripts/*.sh; do bash -n "$f"; done
      - run: PYTHONPATH=src python -m amplio_bench.cli --help
