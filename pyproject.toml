[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amplio-bench"
version = "0.1.0"
description = "Reproducible long-horizon benchmarking and analysis for Amplio"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ritik Jalisatgi"}]
keywords = ["agents", "benchmarking", "long-horizon", "amplio", "evocode"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.scripts]
amplio-bench = "amplio_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
